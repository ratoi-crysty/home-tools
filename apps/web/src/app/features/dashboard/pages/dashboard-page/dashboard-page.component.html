<div class="dashboard">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="logo-section">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <polyline points="9,22 9,12 15,12 15,22" />
          </svg>
        </div>
        <div class="title-group">
          <h1 class="title">HOME TOOLS</h1>
          <span class="subtitle">CONTROL CENTER</span>
        </div>
      </div>
      <div class="status-indicator">
        <span class="indicator-dot"></span>
        <span class="indicator-text">SYSTEM ONLINE</span>
      </div>
    </div>
    <div class="header-line"></div>
  </header>

  <main class="dashboard-content">
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <span class="section-icon">//</span>
          APPLICATIONS
        </h2>
        <div class="section-line"></div>
      </div>

      @if (error()) {
        <div class="error-banner">
          <span class="error-icon">!</span>
          <span class="error-text">{{ error() }}</span>
        </div>
      }

      <div class="apps-grid">
        <app-card
          [status]="delugeStatus()"
          [loading]="delugeLoading()"
          [appName]="'Deluge'"
          [appIcon]="'downloading'"
          (toggleStatus)="onDelugeToggle()"
        />
        <app-card
          [status]="kodiStatus()"
          [loading]="kodiLoading()"
          [appName]="'Kodi'"
          [appIcon]="'live_tv'"
          (toggleStatus)="onKodiToggle()"
        />
      </div>
    </section>
  </main>

  <footer class="dashboard-footer">
    <div class="footer-line"></div>
    <div class="footer-content">
      <span class="version">v1.0.0</span>
      <span class="separator">//</span>
      <span class="timestamp">{{ kodiStatus()?.checkedAt | date:'HH:mm:ss' }}</span>
    </div>
  </footer>
</div>
