services:
  home-tools:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-tools
    restart: unless-stopped
    ports:
      - "8080:80"
    # Required for controlling host applications
    pid: host
    # Required for GUI applications (X11)
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - NODE_ENV=production
    volumes:
      # X11 socket for GUI applications
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # Optional: XAuthority for X11 authentication
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
    # Network host mode for easier host communication (optional)
    # network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
